<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Stellaris - Réservation Premium</title>
    <!-- Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .glassmorphism {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .input-field {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #e2e8f0;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .input-field::placeholder {
            color: #a0aec0;
        }
        .input-field:focus {
            outline: none;
            border-color: #63b3ed;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.5);
        }
        .btn-premium {
            background: linear-gradient(90deg, #63b3ed 0%, #007bff 100%);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }
        .btn-premium:hover {
            background: linear-gradient(90deg, #007bff 0%, #63b3ed 100%);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.6);
            transform: translateY(-2px);
        }
        .table-header {
            background: rgba(255, 255, 255, 0.15);
        }
        .table-row-odd {
            background: rgba(255, 255, 255, 0.05);
        }
        .table-row-even {
            background: rgba(255, 255, 255, 0.02);
        }
    </style>
</head>
<body class="text-white">

    <div class="container mx-auto p-8 max-w-5xl glassmorphism flex flex-col lg:flex-row gap-8">
        <!-- Section Réservation -->
        <div class="lg:w-1/2 p-6">
            <h1 class="text-4xl font-extrabold mb-8 text-center text-blue-300">
                <i class="fas fa-hotel mr-3"></i> Hotel Stellaris
            </h1>
            <h2 class="text-2xl font-semibold mb-6 text-center text-blue-200">Nouvelle Réservation</h2>

            <form id="reservationForm" class="space-y-5">
                <div>
                    <label for="guestName" class="block text-gray-300 text-sm font-medium mb-2">Nom du client</label>
                    <input type="text" id="guestName" name="guestName" placeholder="John Doe" required
                           class="w-full input-field">
                </div>
                <div>
                    <label for="email" class="block text-gray-300 text-sm font-medium mb-2">Email</label>
                    <input type="email" id="email" name="email" placeholder="john.doe@example.com" required
                           class="w-full input-field">
                </div>
                <div>
                    <label for="roomType" class="block text-gray-300 text-sm font-medium mb-2">Type de chambre</label>
                    <select id="roomType" name="roomType" required
                            class="w-full input-field appearance-none cursor-pointer">
                        <option value="" disabled selected>Sélectionnez un type de chambre</option>
                        <option value="Standard">Standard</option>
                        <option value="Deluxe">Deluxe</option>
                        <option value="Suite">Suite</option>
                    </select>
                </div>
                <div>
                    <label for="checkInDate" class="block text-gray-300 text-sm font-medium mb-2">Date d'arrivée</label>
                    <input type="date" id="checkInDate" name="checkInDate" required
                           class="w-full input-field">
                </div>
                <div>
                    <label for="checkOutDate" class="block text-gray-300 text-sm font-medium mb-2">Date de départ</label>
                    <input type="date" id="checkOutDate" name="checkOutDate" required
                           class="w-full input-field">
                </div>
                <button type="submit" class="w-full btn-premium">
                    <i class="fas fa-calendar-plus mr-2"></i> Réserver maintenant
                </button>
            </form>
            <div id="message" class="mt-4 text-center font-semibold"></div>
        </div>

        <!-- Section Liste des Réservations -->
        <div class="lg:w-1/2 p-6 border-t lg:border-t-0 lg:border-l border-gray-700">
            <h2 class="text-2xl font-semibold mb-6 text-center text-blue-200">Réservations existantes</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm text-left text-gray-200 rounded-lg overflow-hidden">
                    <thead class="text-xs uppercase table-header">
                        <tr>
                            <th scope="col" class="py-3 px-4">ID</th>
                            <th scope="col" class="py-3 px-4">Client</th>
                            <th scope="col" class="py-3 px-4">Chambre</th>
                            <th scope="col" class="py-3 px-4">Arrivée</th>
                            <th scope="col" class="py-3 px-4">Départ</th>
                        </tr>
                    </thead>
                    <tbody id="reservationsList">
                        <!-- Les réservations seront chargées ici par JavaScript -->
                        <tr>
                            <td colspan="5" class="py-4 px-4 text-center text-gray-400">Chargement des réservations...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
